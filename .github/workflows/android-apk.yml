name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Create APK report
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          {
            echo "APK path: $APK"
            echo "APK exists:"
            test -f "$APK" && echo "YES" || echo "NO"
            echo "APK size:"
            stat -c "%s bytes" "$APK"
            echo "File type:"
            file "$APK"
            echo "Directory listing:"
            find android/app/build/outputs -type f -printf "%p %s bytes\n"
          } > apk-report.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-media-studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK report
        uses: actions/upload-artifact@v4
        with:
          name: apk-report
          path: apk-report.txt
