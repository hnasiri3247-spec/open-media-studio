name: Backend Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "uvicorn>=0.30,<1"

      - name: Compile check
        run: |
          python -m compileall app

      - name: Start backend
        env:
          MOCK_MODE: "false"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid
          sleep 5

      - name: Test API health
        run: |
          cat backend.log
          curl --fail --show-error http://127.0.0.1:8000/api/health

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi
