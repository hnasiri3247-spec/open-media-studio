name: Backend Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  backend-integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "uvicorn>=0.30,<1"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Compile check
        run: |
          python -m compileall app

      - name: Verify FFmpeg
        run: |
          FFMPEG_PATH="$(command -v ffmpeg)"
          echo "FFMPEG_PATH=$FFMPEG_PATH"
          echo "FFMPEG_BIN=$FFMPEG_PATH" >> "$GITHUB_ENV"
          "$FFMPEG_PATH" -version

      - name: Check backend FFmpeg environment
        run: |
          echo "FFMPEG_BIN=$FFMPEG_BIN"
          python -c 'import os; print("PYTHON_FFMPEG_BIN=" + str(os.getenv("FFMPEG_BIN")))'
          "$FFMPEG_BIN" -version

      - name: Start backend
        env:
          MOCK_MODE: "false"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid
          sleep 5

      - name: Backend health
        run: |
          cat backend.log
          curl --fail --show-error http://127.0.0.1:8000/api/health

      - name: Create test project
        run: |
          curl --fail --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"title":"Integration Test","script":"Real API integration test","format":"16:9","duration":10,"style":"test"}' \
            http://127.0.0.1:8000/api/projects \
            > project.json

          cat project.json

          python - <<'PY'
          import json
          p = json.load(open("project.json"))
          assert p["id"]
          print("PROJECT_ID=" + p["id"])
          PY

          python -c 'import json; print(json.load(open("project.json"))["id"])' > project_id.txt

      - name: Test Piper network from runner
        run: |
          echo "===== PIPER NETWORK TEST ====="
          curl -sS -L --connect-timeout 30 --max-time 90 https://gyroing-persian-tts-piper.hf.space/gradio_api/info || true
          echo "================================"

      - name: Test Python httpx to Piper
        run: |
          python - <<'PY2'
          import asyncio
          import httpx

          async def main():
              try:
                  async with httpx.AsyncClient(timeout=30) as client:
                      r = await client.get(
                          "https://gyroing-persian-tts-piper.hf.space/gradio_api/info"
                      )
                      print("STATUS:", r.status_code)
                      print("BODY:", r.text[:500])
              except Exception as e:
                  print("ERROR TYPE:", type(e).__name__)
                  print("ERROR:", repr(e))

          asyncio.run(main())
          PY2

      - name: Test Python httpx POST to Piper
        run: |
          python - <<'PY2'
          import asyncio
          import httpx

          async def main():
              url = "https://gyroing-persian-tts-piper.hf.space/gradio_api/call/synthesize_speech"
              payload = {"data": ["hello from GitHub httpx POST", "", 1.0]}

              try:
                  async with httpx.AsyncClient(timeout=120, http2=False) as client:
                      r = await client.post(url, json=payload)
                      print("STATUS:", r.status_code)
                      print("BODY:", r.text)
                      r.raise_for_status()
              except Exception as e:
                  print("ERROR TYPE:", type(e).__name__)
                  print("ERROR:", repr(e))
                  raise

          asyncio.run(main())
          PY2

      - name: Test Piper direct API curl
        run: |
          curl -v --max-time 120 \
          -H "Content-Type: application/json" \
          -d '{"data":["hello from curl","",1.0]}' \
          https://gyroing-persian-tts-piper.hf.space/gradio_api/call/synthesize_speech || true

      - name: Test Piper through Backend
        run: |
          PID=$(cat project_id.txt)

          curl --show-error \
            --max-time 300 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"text":"This is a real Piper integration test.","voice":""}' \
            "http://127.0.0.1:8000/api/projects/$PID/voice" \
            > voice.json || true

          echo "===== PIPER BACKEND RESPONSE ====="
          cat voice.json
          echo "==================================="

          echo "===== BACKEND LOG AFTER PIPER ====="
          cat backend.log
          echo "===================================="

          grep -q '"audio"' voice.json || {
            echo "Piper backend returned an invalid response."
            exit 1
          }

          cat voice.json

          python - <<'PY'
          import json
          p=json.load(open("voice.json"))
          assert p["audio"]
          assert any(x.get("type")=="voice" for x in p["audio"])
          print("Piper: PASS")
          PY

      - name: Test MusicGen through Backend
        run: |
          PID=$(cat project_id.txt)

          curl --show-error \
            --max-time 600 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"prompt":"upbeat instrumental music, energetic rhythm, cinematic pop","duration":10}' \
            "http://127.0.0.1:8000/api/projects/$PID/music" \
            > music.json || STATUS=$?
          STATUS=${STATUS:-0}
          echo "===== MUSICGEN CURL STATUS: $STATUS ====="
          echo "===== MUSICGEN RESPONSE ====="
          cat music.json || true
          echo "===== BACKEND LOG ====="
          cat backend.log || true
          echo "===== END BACKEND LOG ====="
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

          cat music.json

          python - <<'PY'
          import json
          p=json.load(open("music.json"))
          assert any(x.get("type")=="music" for x in p["audio"])
          print("MusicGen: PASS")
          PY

      - name: Test AudioGen through Backend
        run: |
          PID=$(cat project_id.txt)

          curl --fail --show-error \
            --max-time 600 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"prompt":"realistic thunder and heavy rain, cinematic sound effect","duration":5}' \
            "http://127.0.0.1:8000/api/projects/$PID/sfx" \
            > sfx.json

          cat sfx.json

          python - <<'PY'
          import json
          p=json.load(open("sfx.json"))
          assert any(x.get("type")=="sfx" for x in p["audio"])
          print("AudioGen: PASS")
          PY

      - name: Test Wan 2.2 through Backend
        run: |
          PID=$(cat project_id.txt)

          curl --fail --show-error \
            --max-time 1200 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"prompt":"a cinematic shot of a small red bird flying over a green forest at sunset","duration":3}' \
            "http://127.0.0.1:8000/api/projects/$PID/scenes" \
            > scene.json

          cat scene.json

          python - <<'PY'
          import json
          p=json.load(open("scene.json"))
          assert p["scenes"]
          assert p["scenes"][0]["media"]
          print("Wan 2.2: PASS")
          PY

      - name: Show backend log on failure
        if: failure()
        run: |
          cat backend.log || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi
