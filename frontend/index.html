<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Media Studio</title><style>body{font-family:system-ui;margin:24px auto;max-width:900px;padding:0 16px}textarea,input,select,button{width:100%;padding:10px;margin:6px 0 12px;box-sizing:border-box}button{cursor:pointer}.card{border:1px solid #ddd;border-radius:10px;padding:18px;margin-bottom:16px}pre{white-space:pre-wrap;background:#f6f6f6;padding:12px;overflow:auto}a{display:inline-block;margin-top:8px}</style></head><body><h1>Open Media Studio</h1><div class="card"><h2>Create Project</h2><input id="title" placeholder="Project title"><textarea id="script" rows="5" placeholder="Script"></textarea><select id="format"><option>9:16</option><option>16:9</option><option>1:1</option></select><input id="duration" type="number" min="1" max="300" value="15"><input id="style" value="cartoon"><button onclick="createProject()">Create</button></div><div class="card"><h2>Project</h2><input id="pid" placeholder="Project ID"><textarea id="scene" placeholder="Scene prompt"></textarea><button onclick="scene()">Generate Scene</button><textarea id="voice" placeholder="Voice text"></textarea><button onclick="voiceGen()">Generate Voice</button><input id="music" placeholder="Music prompt"><button onclick="musicGen()">Generate Music</button><input id="sfx" placeholder="SFX prompt"><button onclick="sfxGen()">Generate SFX</button><button onclick="render()">Render MP4</button><a id="download" hidden target="_blank">Open rendered MP4</a><pre id="out"></pre></div><script>const out=document.getElementById('out'),download=document.getElementById('download');const j=(u,o)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).then(async r=>{const x=await r.json();if(!r.ok)throw new Error(x.detail||r.statusText);out.textContent=JSON.stringify(x,null,2);return x});async function createProject(){try{const x=await j('/api/projects',{title:title.value,script:script.value,format:format.value,duration:+duration.value,style:style.value});pid.value=x.id}catch(e){out.textContent=e.message}}async function scene(){try{await j('/api/projects/'+pid.value+'/scenes',{prompt:document.getElementById('scene').value,duration:5})}catch(e){out.textContent=e.message}}async function voiceGen(){try{await j('/api/projects/'+pid.value+'/voice',{text:voice.value,voice:'default'})}catch(e){out.textContent=e.message}}async function musicGen(){try{await j('/api/projects/'+pid.value+'/music',{prompt:music.value,duration:+duration.value})}catch(e){out.textContent=e.message}}async function sfxGen(){try{await j('/api/projects/'+pid.value+'/sfx',{prompt:sfx.value,duration:5})}catch(e){out.textContent=e.message}}async function render(){try{const x=await j('/api/projects/'+pid.value+'/render',{project_id:pid.value});download.href=x.file;download.hidden=false}catch(e){out.textContent=e.message}}</script></body></html>
